<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">

<title>Moni ซักผ้า 24 ชั่วโมง</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#splash{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

#logo{
    width:320px;
    max-width:90%;
}

.loading{
    margin-top:20px;
    color:#ff4f94;
    font-size:18px;
    font-weight:bold;
}

.spinner{
    width:45px;
    height:45px;
    margin-top:20px;
    border:5px solid #ffd1e4;
    border-top:5px solid #ff4f94;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

iframe{
    width:100%;
    height:100%;
    border:none;
    display:none;
}
</style>

</head>

<body>

<div id="splash">

    <img id="logo"
         src="LOGO_URL"
         alt="Moni ซักผ้า 24 ชั่วโมง">

    <div class="loading">
        กำลังโหลดระบบ...
    </div>

    <div class="spinner"></div>

</div>

<iframe id="app"
src="https://script.google.com/macros/s/AKfycbwI0YZLqDQgMkNtmrkxKtRzEsLXiEEi2DKnKOZs9gWxN4vnPlx1q2-LBeH9593Dqa7hpA/exec">
</iframe>

<script>
setTimeout(function(){

    document.getElementById("splash").style.display="none";
    document.getElementById("app").style.display="block";

},3000);
</script>

</body>
</html>
