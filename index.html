
<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--blue:#0d6efd;--blue2:#0957d0;--navy:#172b4d;--bg:#f5f7fb;--card:#fff;--text:#172133;--muted:#6b7280;--line:#e7ebf1;--green:#20a464;--orange:#f59e0b;--red:#e5484d;--purple:#7c3aed}
    *{box-sizing:border-box} html{-webkit-text-size-adjust:100%;text-size-adjust:100%} body{margin:0;font-family:'Prompt',sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}.app{min-height:100vh}.loading{position:fixed;inset:0;background:#ffffffcc;z-index:9999;display:flex;align-items:center;justify-content:center;font-weight:600}
    .toast{position:fixed;right:22px;top:22px;z-index:99999;background:#172133;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 10px 30px #0003;max-width:360px}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef5ff,#f8fbff)}
    .login-card{width:min(960px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:white;border-radius:24px;overflow:hidden;box-shadow:0 25px 70px #22457722}
    .login-art{padding:48px;background:linear-gradient(145deg,#0d6efd,#5aa7ff);color:#fff;display:flex;flex-direction:column;justify-content:center}
    .washer{font-size:110px;filter:drop-shadow(0 10px 15px #0002)} .login-panel{padding:42px}.login-brand-logo-wrap{display:flex;justify-content:center;align-items:center;min-height:112px;margin:0 0 14px}.login-brand-logo{width:190px;max-width:80%;height:105px;object-fit:contain;border-radius:16px;background:#fff;padding:6px}.login-brand-fallback{font-size:58px;line-height:1}.login-panel .brand{text-align:center}.login-panel>.muted{text-align:center}
    .brand{font-size:22px;font-weight:700}.muted{color:var(--muted);font-size:13px}.field{margin:13px 0}
    .field label{display:block;font-size:13px;margin-bottom:7px;font-weight:500}.input{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:11px;outline:none;background:#fff}
    .input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0d6efd18}
    .btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
    .btn-light{background:#f1f5f9;color:#334155}.btn-danger{background:#fff0f0;color:var(--red)}.btn-success{background:#eaf8f0;color:var(--green)}
    .btn-block{width:100%}.link{color:var(--blue);cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
    .sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
    .sidebar.admin{background:#172b4d;color:#fff}.logo{display:flex;gap:12px;align-items:center;padding:8px 10px 22px}.logo-icon{font-size:30px}.store-logo{width:48px;height:48px;object-fit:contain;border-radius:12px;background:#fff;padding:3px;border:1px solid var(--line)}.hero-store-logo{width:92px;height:92px;object-fit:contain;border-radius:18px;background:#fff;padding:6px;box-shadow:0 8px 24px #0f172a18;flex:0 0 auto}.brand-title{font-weight:800;line-height:1.2}
    .nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;color:#475569;display:flex;gap:10px}
    .admin .nav button{color:#d8e2f2}.nav button.active{background:#eaf3ff;color:var(--blue);font-weight:600}.admin .nav button.active{background:#2865b5;color:#fff}
    .main{padding:22px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.topbar h2{margin:0;font-size:22px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dcecff}
    .grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #18233a08}.card h3{margin:0 0 12px;font-size:16px}
    .stat{display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:28px}.stat .ico{font-size:30px}
    .machine-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.machine{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}
    .machine.selected{border-color:var(--blue);box-shadow:0 0 0 3px #0d6efd18}.machine .pic{height:110px;display:flex;align-items:center;justify-content:center;margin:8px 0}
.machine .pic img{width:96px;height:96px;object-fit:contain}
.stepper{display:flex;gap:8px;margin-bottom:16px}.step-dot{flex:1;padding:9px;border-radius:10px;background:#eef2f7;color:#64748b;text-align:center;font-size:12px}.step-dot.active{background:#eaf3ff;color:var(--blue);font-weight:600}
.summary-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.profile-photo{width:108px;height:108px;border-radius:50%;object-fit:cover;border:4px solid #eaf3ff;background:#eef4fb}
.profile-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}.profile-head h2{margin:8px 0 0;line-height:1.3;max-width:100%}.profile-email{display:block;position:relative;z-index:2;width:100%;max-width:100%;min-height:24px;margin:0;padding:2px 12px 6px;color:var(--muted);font-size:14px;line-height:1.55;overflow-wrap:anywhere;word-break:break-word;white-space:normal}.profile-upload{display:inline-flex;align-items:center;justify-content:center;position:static!important;z-index:auto;margin:6px 0 0;max-width:100%;min-height:44px;flex:none}
.profile-menu{display:grid;gap:10px;margin-top:18px}.profile-menu button{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;text-align:left}.profile-menu button:hover{background:#f7faff;border-color:#b8d4ff}.profile-menu .left{display:flex;align-items:center;gap:12px}.profile-menu .icon{width:38px;height:38px;border-radius:10px;background:#eaf3ff;display:grid;place-items:center;font-size:20px}.profile-section{max-width:760px;margin:auto}
.hero-book{background:linear-gradient(135deg,#0d6efd,#55a4ff);color:#fff;border:0}
.hero-book .muted{color:#e8f3ff}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
    .badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:600}.available{background:#eaf8f0;color:var(--green)}.reserved{background:#fff7df;color:#b77900}
    .in_use{background:#eaf3ff;color:var(--blue)}.maintenance{background:#fff0e5;color:#d97706}.disabled{background:#f1f5f9;color:#64748b}
    .pending{background:#fff7df;color:#b77900}.confirmed,.paid,.completed{background:#eaf8f0;color:var(--green)}.cancelled,.rejected{background:#fff0f0;color:var(--red)}.checking{background:#eee9ff;color:var(--purple)}
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:none;padding:10px 4px;color:var(--muted)}.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}
    .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.user-toolbar{margin-bottom:14px}.user-actions{flex-wrap:wrap}.email-cell{overflow-wrap:anywhere;word-break:break-word}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:#64748b;font-weight:600;background:#fafbfc}
    .slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{border:1px solid var(--line);padding:9px;border-radius:9px;background:#fff}.slot.active{background:var(--blue);color:#fff}.slot:disabled{opacity:.35}
    .modal{position:fixed;inset:0;background:#0006;z-index:999;display:grid;place-items:center;padding:20px}.modal-box{background:#fff;border-radius:18px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}
    .mobilebar{display:none}.mobile-admin-logout{display:none;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 12px;background:#fff0f0;color:var(--red);font-weight:600;white-space:nowrap}.notice{padding:12px;border-radius:12px;background:#edf6ff;color:#315a88;font-size:13px}.empty{text-align:center;padding:30px;color:var(--muted)}
    @media(max-width:980px){.grid-4,.machine-grid{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:18px 14px 82px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:7px;padding-bottom:max(7px,env(safe-area-inset-bottom))}.mobile-admin-logout{display:inline-flex}.mobilebar button{border:0;background:none;font-size:11px;color:#64748b}.login-card{grid-template-columns:1fr}.login-art{display:none}.grid-2,.grid-3{grid-template-columns:1fr}}
    @media(max-width:560px){.login-brand-logo-wrap{min-height:92px;margin-bottom:10px}.login-brand-logo{width:165px;height:88px}.login-brand-fallback{font-size:48px}.login-panel .brand{font-size:21px;line-height:1.35}.user-toolbar{align-items:stretch;flex-direction:column}.user-toolbar .btn{width:100%}.user-actions{min-width:220px}.user-actions .btn{flex:1;padding:9px 8px}.grid-4,.machine-grid,.slot-grid{grid-template-columns:1fr 1fr}.login-panel{padding:28px 20px}.main{padding-top:14px}.card{padding:14px}table{font-size:11px}.hide-sm{display:none}.profile-head{gap:8px}.profile-head h2{font-size:24px}.profile-email{font-size:14px;line-height:1.5;padding:4px 8px 8px}.profile-upload{width:auto;max-width:100%;font-size:14px;padding:10px 14px;margin-top:4px}}
  </style>
</head>
<body>
<div id="loading" class="loading hidden">กำลังโหลด...</div>
<div id="toast" class="toast hidden"></div>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <section class="login-art">
      <div class="washer">🧺</div>
      <h1>ระบบจองเครื่องซักผ้า</h1>
      <p>สะดวก รวดเร็ว จองได้ทุกเวลา รองรับเงินสดและพร้อมเพย์</p>
    </section>
    <section class="login-panel">
      <div id="loginLogoBox" class="login-brand-logo-wrap"><div class="login-brand-fallback">🫧</div></div>
      <div class="brand"><span data-system-name>ระบบจองเครื่องซักผ้า</span></div>
      <p class="muted">เข้าสู่ระบบเพื่อจองเครื่องซักผ้า</p>
      <div id="loginForm">
        <div class="field"><label>อีเมล</label><input id="loginEmail" class="input" type="email" placeholder="example@email.com"></div>
        <div class="field"><label>รหัสผ่าน</label><input id="loginPassword" class="input" type="password" placeholder="อย่างน้อย 6 ตัว"></div>
        <button class="btn btn-primary btn-block" onclick="login()">เข้าสู่ระบบ</button>
        <p class="muted" style="text-align:right"><span class="link" onclick="forgotPasswordModal()">ลืมรหัสผ่าน?</span></p>
        <p class="muted" style="text-align:center">ยังไม่มีบัญชี? <span class="link" onclick="showRegister(true)">สมัครสมาชิก</span></p>
        <div class="notice">Moni สะดวก รวดเร็ว จองได้ทุกเวลา </div>
      </div>
      <div id="registerForm" class="hidden">
        <div class="field"><label>ชื่อ-นามสกุล</label><input id="regName" class="input"></div>
        <div class="field"><label>อีเมล</label><input id="regEmail" class="input" type="email"></div>
        <div class="field"><label>เบอร์โทร</label><input id="regPhone" class="input"></div>
        <div class="field"><label>รหัสผ่าน</label><input id="regPassword" class="input" type="password"></div>
        <button class="btn btn-primary btn-block" onclick="register()">สมัครสมาชิก</button>
        <p class="muted" style="text-align:center"><span class="link" onclick="showRegister(false)">กลับไปเข้าสู่ระบบ</span></p>
      </div>
    </section>
  </div>
</div>

<div id="appView" class="app hidden"></div>

<script>
let token=localStorage.getItem('laundry_token')||'';
let currentUser=null, machines=[], selectedMachine=null, selectedSlot=null, chart=null, appConfig=null;
async function getAppConfig(){if(!appConfig) appConfig=await gas('publicConfig'); return appConfig||{};}
function logoHtml(c,cls='store-logo'){return c&&c.storeLogoEnabled&&c.storeLogoUrl?`<img class="${cls}" src="${esc(c.storeLogoUrl)}" alt="โลโก้ร้าน" onerror="this.style.display='none'">`:'';}
async function applyBrand(){try{const c=await getAppConfig();document.querySelectorAll('[data-system-name]').forEach(el=>el.textContent=c.systemName||'ระบบจองเครื่องซักผ้า');const box=document.getElementById('sidebarLogoBox');if(box){box.innerHTML=logoHtml(c)||'<div class="logo-icon">🫧</div>';}const loginBox=document.getElementById('loginLogoBox');if(loginBox){loginBox.innerHTML=logoHtml(c,'login-brand-logo')||'<div class="login-brand-fallback">🫧</div>';}}catch(e){console.error('applyBrand',e)}}
const pages={
 user:[
  ['home','🏠','หน้าแรก'],['booking','📅','จองเครื่องซักผ้า'],['mybookings','🧾','รายการจองของฉัน'],
  ['notifications','🔔','การแจ้งเตือน'],['profile','👤','โปรไฟล์']
 ],
 admin:[
  ['admin-dashboard','🏠','Dashboard'],['admin-users','👥','จัดการผู้ใช้'],['admin-machines','🧺','จัดการเครื่องซักผ้า'],
  ['admin-bookings','📅','จัดการการจอง'],['admin-report','📊','รายงานการใช้งาน'],['admin-settings','⚙️','ตั้งค่าระบบ']
 ]
};
document.addEventListener('DOMContentLoaded',()=>{applyBrand();if(token) resume();});

function gas(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
function load(on=true){document.getElementById('loading').classList.toggle('hidden',!on)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function money(v){return Number(v||0).toLocaleString('th-TH')}
function today(){return new Date().toISOString().slice(0,10)}
function statusText(s){return ({available:'ว่าง',reserved:'จองแล้ว',in_use:'กำลังใช้งาน',maintenance:'ซ่อมบำรุง',disabled:'ปิดใช้งาน',pending:'รอตรวจสอบ',confirmed:'ยืนยันแล้ว',completed:'เสร็จสิ้น',cancelled:'ยกเลิก',checking:'กำลังตรวจสอบ',paid:'ชำระแล้ว',rejected:'ไม่ผ่าน',awaiting_slip:'รอสลิป',pending_cash:'รอรับเงินสด'})[s]||s}
function badge(s){return `<span class="badge ${esc(s)}">${esc(statusText(s))}</span>`}

async function resume(){try{load();currentUser=await gas('me',token);showApp();navigate(currentUser.role==='admin'?'admin-dashboard':'home')}catch(e){localStorage.removeItem('laundry_token');token=''}finally{load(false)}}
function showRegister(on){document.getElementById('loginForm').classList.toggle('hidden',on);document.getElementById('registerForm').classList.toggle('hidden',!on)}
async function login(){try{load();const r=await gas('login',{email:loginEmail.value,password:loginPassword.value});token=r.token;currentUser=r.user;localStorage.setItem('laundry_token',token);showApp();navigate(currentUser.role==='admin'?'admin-dashboard':'home')}catch(e){toast(e.message)}finally{load(false)}}

function forgotPasswordModal(){
 document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modal-box" style="max-width:430px">
 <div class="row between"><h3>ลืมรหัสผ่าน</h3><button class="btn btn-light" onclick="modal.remove()">✕</button></div>
 <p class="muted">กรอกอีเมลที่ใช้สมัคร ระบบจะส่งรหัสผ่านชั่วคราวไปให้</p>
 <div class="field"><label>อีเมล</label><input id="forgotEmail" class="input" type="email"></div>
 <button class="btn btn-primary btn-block" onclick="sendForgotPassword()">ส่งรหัสผ่านชั่วคราว</button></div></div>`);
}
async function sendForgotPassword(){
 try{
  load();
  const r=await gas('forgotPassword',forgotEmail.value);
  modal.remove();
  toast(r.message);
 }catch(e){toast(e.message)}finally{load(false)}
}

async function register(){try{load();const r=await gas('registerUser',{name:regName.value,email:regEmail.value,phone:regPhone.value,password:regPassword.value});token=r.token;currentUser=r.user;localStorage.setItem('laundry_token',token);showApp();navigate('home')}catch(e){toast(e.message)}finally{load(false)}}
async function logout(){
 try{load();await gas('logout',token)}catch(e){}
 token='';currentUser=null;selectedMachine=null;selectedSlot=null;
 localStorage.removeItem('laundry_token');
 appView.innerHTML='';appView.classList.add('hidden');loginView.classList.remove('hidden');
 document.getElementById('loginPassword').value='';showRegister(false);load(false);
}

function showApp(){
 loginView.classList.add('hidden');appView.classList.remove('hidden');
 const list=currentUser.role==='admin'?pages.admin:pages.user;
 appView.innerHTML=`<div class="shell">
 <aside class="sidebar ${currentUser.role==='admin'?'admin':''}">
  <div class="logo"><div id="sidebarLogoBox"><div class="logo-icon">🫧</div></div><div><b class="brand-title" data-system-name>ระบบจองเครื่องซักผ้า</b><div class="muted">${currentUser.role==='admin'?'แอดมิน':'ผู้ใช้งาน'}</div></div></div>
  <div class="nav">${list.map(x=>`<button id="nav-${x[0]}" onclick="navigate('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
  <button onclick="logout()">🚪 ออกจากระบบ</button></div>
 </aside>
 <main class="main"><div class="topbar"><div><h2 id="pageTitle">หน้าแรก</h2><div class="muted">สวัสดี, ${esc(currentUser.name)} 👋</div></div><div class="row">${currentUser.role==='admin'?'<button class="mobile-admin-logout" onclick="logout()">🚪 ออกจากระบบ</button>':''}<div class="avatar">👤</div></div></div><div id="content"></div></main>
 </div><div class="mobilebar">${(currentUser.role==='admin'?list.slice(0,4):pages.user.filter(x=>['home','booking','mybookings','profile'].includes(x[0]))).map(x=>`<button onclick="navigate('${x[0]}')"><div>${x[1]}</div>${x[2]}</button>`).join('')}</div>`;
 applyBrand();
}
function setActive(page,title){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+page)?.classList.add('active');pageTitle.textContent=title}
async function navigate(page){try{load();const map={
 'home':['หน้าแรก',renderHome],'booking':['จองเครื่องซักผ้า',renderBooking],'mybookings':['รายการจองของฉัน',renderMyBookings],
 'notifications':['การแจ้งเตือน',renderNotifications],'profile':['โปรไฟล์ของฉัน',renderProfile],
 'admin-dashboard':['Dashboard',renderAdminDashboard],'admin-users':['จัดการผู้ใช้',renderAdminUsers],
 'admin-machines':['จัดการเครื่องซักผ้า',renderAdminMachines],'admin-bookings':['จัดการการจอง',renderAdminBookings],
 'admin-report':['รายงานการใช้งาน',renderAdminReport],'admin-settings':['ตั้งค่าระบบ',renderAdminSettings]
 };setActive(page,map[page][0]);await map[page][1]()}catch(e){toast(e.message)}finally{load(false)}}

async function renderHome(){
 const homeCfg=await getAppConfig();
 let d={};
 try{ d=(await gas('getDashboard',token))||{}; }catch(e){ console.error('getDashboard:',e); }
 // เรียกสรุปเครื่องแบบเบาแยกอีกครั้ง เพื่อให้หน้าลูกค้าไม่ขึ้น 0 แม้ข้อมูลส่วนการจองมีปัญหา
 try{
   const live=(await gas('getCustomerMachineStats',token))||{};
   if(live.stats) d.stats=live.stats;
   if(Array.isArray(live.machines)) d.machines=live.machines;
 }catch(e){ console.error('getCustomerMachineStats:',e); }
 machines=Array.isArray(d.machines)?d.machines:[];d.stats=d.stats||{total:0,available:0,inUse:0,reserved:0,maintenance:0};d.upcoming=Array.isArray(d.upcoming)?d.upcoming:[];d.notifications=Array.isArray(d.notifications)?d.notifications:[];

function bookingTable(rows,actions=false){return `<div style="overflow:auto"><table><thead><tr><th>ผู้ใช้</th><th>เครื่อง</th><th>วันที่</th><th>เวลา</th><th>ชำระเงิน</th><th>สถานะ</th>${actions?'<th>จัดการ</th>':''}</tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.userName)}</td><td>${esc(b.machineName)}</td><td>${esc(b.date)}</td><td>${esc(b.startTime)}</td><td>${badge(b.paymentStatus)}</td><td>${badge(b.bookingStatus)}</td>${actions?`<td><button class="btn btn-light" onclick="navigate('admin-bookings')">ดู</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}

 try{

async function renderAdminMachines(){machines=await gas('getMachines',token);machines=Array.isArray(machines)?machines:[];content.innerHTML=`<div class="card"><div class="row between"><h3>เครื่องซักผ้าทั้งหมด</h3><button class="btn btn-primary" onclick="machineModal()">+ เพิ่มเครื่อง</button></div><table><thead><tr><th>เครื่อง</th><th>สถานะ</th><th>ตำแหน่ง</th><th>ราคา</th><th>เวลา</th><th>จัดการ</th></tr></thead><tbody>${machines.map(m=>`<tr><td>${esc(m.name)}</td><td>${badge(m.status)}</td><td>${esc(m.floor)} ${esc(m.zone)}</td><td>${money(m.price)} บาท</td><td>${m.duration} นาที</td><td><button class="btn btn-light" onclick='machineModal(${JSON.stringify(m)})'>แก้ไข</button> <button class="btn btn-danger" onclick="deleteMachine('${m.id}')">ลบ</button></td></tr>`).join('')}</tbody></table></div>`}

async function renderAdminReport(){content.innerHTML=`<div class="card"><div class="row"><div class="field"><label>ตั้งแต่วันที่</label><input id="rf" class="input" type="date" value="${today().slice(0,8)}01"></div><div class="field"><label>ถึงวันที่</label><input id="rt" class="input" type="date" value="${today()}"></div><button class="btn btn-primary" onclick="loadReport()">แสดงรายงาน</button></div><div id="reportBox"></div></div>`;loadReport()}

async function renderAdminSettings(){

async function saveSettings(){try{load();const r=await gas('adminSaveSettings',token,{systemName:systemName.value.trim(),storeLogoUrl:storeLogoUrl.value.trim(),storeLogoEnabled:String(storeLogoEnabled.checked),defaultPrice:defaultPrice.value,defaultDuration:defaultDuration.value,promptpayId:promptpayId.value.trim(),promptpayName:promptpayName.value.trim(),promptpayQrUrl:promptpayQrUrl.value.trim(),openTime:'00:00',closeTime:'23:59',cashEnabled:String(cashEnabled.checked),promptpayEnabled:String(promptpayEnabled.checked)});appConfig=null;await getAppConfig();applyBrand();toast('บันทึกการตั้งค่าแล้ว');await renderAdminSettings()}catch(e){toast(e.message)}finally{load(false)}}
function timeSlotModal(s={}){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modal-box"><div class="row between"><h3>${s.id?'แก้ไขช่วงเวลา':'เพิ่มช่วงเวลา'}</h3><button class="btn btn-light" onclick="modal.remove()">✕</button></div><input id="sid" type="hidden" value="${esc(s.id||'')}"><div class="grid grid-2"><div class="field"><label>เวลาเริ่ม</label><input id="slotStart" class="input" type="time" value="${esc(s.startTime||'00:00')}"></div><div class="field"><label>เวลาสิ้นสุด</label><input id="slotEnd" class="input" type="time" value="${esc(s.endTime||'00:50')}"></div><div class="field"><label>ลำดับการแสดง</label><input id="slotOrder" class="input" type="number" value="${s.sortOrder||1}"></div><div class="field"><label>สถานะ</label><select id="slotActive" class="input"><option value="true" ${s.active!==false?'selected':''}>เปิดใช้งาน</option><option value="false" ${s.active===false?'selected':''}>ปิดใช้งาน</option></select></div></div><div class="field"><label>หมายเหตุ</label><input id="slotNote" class="input" value="${esc(s.note||'')}"></div><button class="btn btn-primary btn-block" onclick="saveTimeSlot()">บันทึกช่วงเวลา</button></div></div>`)}
async function saveTimeSlot(){try{await gas('adminSaveTimeSlot',token,{id:sid.value,startTime:slotStart.value,endTime:slotEnd.value,sortOrder:slotOrder.value,active:slotActive.value==='true',note:slotNote.value});modal.remove();toast('บันทึกช่วงเวลาแล้ว');renderAdminSettings()}catch(e){toast(e.message)}}
async function deleteTimeSlot(id){if(!confirm('ลบช่วงเวลานี้หรือไม่?'))return;try{await gas('adminDeleteTimeSlot',token,id);toast('ลบแล้ว');renderAdminSettings()}catch(e){toast(e.message)}}

</script>
</body>
</html>
